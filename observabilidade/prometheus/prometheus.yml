# Prometheus (atividade extra de observabilidade): coleta ("scrape") o
# /metrics de cada serviço a cada 15s e guarda a série temporal.
#
# Os alvos são <serviço>:9100 — a porta interna de métricas, que NÃO é
# publicada pro host (ver app/main.py): o Prometheus lê de dentro da rede
# catalog-net, pelo nome do serviço no compose.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: catalogo
    static_configs:
      - targets: ["api:9100"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:9100"]

  - job_name: log-service
    static_configs:
      - targets: ["log-service:9100"]

  # O próprio Prometheus — só pra conferir que a coleta está de pé.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

version_path_separator = os

# sqlalchemy.url é definida em tempo de execução por alembic/env.py,
# lida de DATABASE_URL no .env (via app.config.Settings) — o auth-service
# usa o MESMO MySQL remoto do catálogo, mas com uma tabela de controle de
# versão própria (alembic_version_auth) pra não colidir com o Alembic do
# catálogo, que já roda nesse mesmo banco.

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

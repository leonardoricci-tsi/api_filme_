networks:
  catalog-net:
    driver: bridge

volumes:
  redis-data:
  garage-meta:
  garage-data:
  prometheus-data:

services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    # /metrics numa porta à parte, NÃO publicada: a 8000 é pública, a 9100 só
    # existe na rede interna (quem lê é o Prometheus).
    expose:
      - "9100"
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      LOG_SERVICE_URL: http://log-service:8002
      S3_ENDPOINT_URL: http://garage:3900
    # Readiness de verdade (GET /health do catálogo): com o MySQL fora ele
    # responde 503 e o `docker ps` passa a mostrar (unhealthy). Python/urllib
    # porque a imagem slim não tem curl — o urlopen levanta erro no 503.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen('http://localhost:%s/health' % os.getenv('PORT', '8000'), timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - catalog-net
    depends_on:
      - auth-service
      - log-service
      - garage

  migrate:
    build: .
    env_file:
      - .env
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    networks:
      - catalog-net
    profiles:
      - tools

  # Serviço de autenticação: login, cadastro, papéis (role) e (a partir da
  # fase 3) esqueci-minha-senha. De propósito SEM `ports:` — não é
  # alcançável do host, só de dentro da rede `catalog-net`, pelo nome do
  # serviço (http://auth-service:8001). O catálogo (`api`) é o único
  # container com porta publicada pro host.
  auth-service:
    build: ./auth-service
    env_file:
      - .env
    environment:
      LOG_SERVICE_URL: http://log-service:8002
    expose:
      - "8001"
      - "9100"   # /metrics (Prometheus), só na rede interna
    # GET /health: 503 com o MySQL fora → (unhealthy).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - catalog-net
    depends_on:
      - log-service

  migrate-auth:
    build: ./auth-service
    env_file:
      - .env
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    networks:
      - catalog-net
    profiles:
      - tools

  # Serviço de auditoria (atividade 5): recebe evento de log de todo mundo
  # (catálogo, auth-service) e grava num Redis Stream. Mesmo princípio do
  # auth-service: sem `ports:`, só alcançável de dentro da rede
  # `catalog-net`, pelo nome do serviço (http://log-service:8002).
  log-service:
    build: ./log-service
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8002"
      - "9100"   # /metrics (Prometheus), só na rede interna
    # GET /health: 503 com o Redis fora → (unhealthy) sozinho, sem ninguém
    # mexer no log-service (é a prova pedida na atividade de observabilidade).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - catalog-net
    depends_on:
      - redis

  # Guarda só os eventos de auditoria (Redis Stream) — não é o banco de
  # negócio (MySQL remoto, fora do compose), por isso um container à parte.
  # Sem `ports:`: só o log-service fala com ele, de dentro da rede.
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - catalog-net
    volumes:
      - redis-data:/data

  # Object storage (atividade 6): guarda o arquivo da foto de perfil — o
  # MySQL guarda só a chave do objeto. Garage no lugar do MinIO.
  # Mesmo princípio dos outros serviços internos: sem `ports:`. O navegador
  # abre a foto por URL pré-assinada no domínio do catálogo, que repassa pro
  # Garage pela rede interna (app/routers/storage_proxy.py).
  garage:
    build: ./garage
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-api-filmes-perfis}
    expose:
      - "3900"
    # A imagem do Garage não tem shell nem curl, só o binário: `garage status`
    # fala com o nó pelo RPC e sai com erro se ele não responder.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - catalog-net
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # Observabilidade (atividade extra): o Prometheus coleta o /metrics de
  # cada serviço (porta interna 9100) a cada 15s e guarda a série temporal
  # por 7 dias. Porta só no localhost do host (127.0.0.1) — pra olhar os
  # alvos em http://localhost:9090/targets, sem abrir pra rede.
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - catalog-net
    depends_on:
      - api
      - auth-service
      - log-service

  # Painel em http://localhost:3000 (só no localhost do host). Fonte de dados
  # e painel vêm prontos do repositório (observabilidade/grafana/), sem
  # clicar em nada. Qualquer um vê o painel sem login (papel Viewer, só
  # leitura); editar exige o admin, com a senha vinda do .env — nunca aqui.
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-filmes.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - catalog-net
    depends_on:
      - prometheus

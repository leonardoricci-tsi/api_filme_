networks:
  catalog-net:
    driver: bridge

volumes:
  redis-data:
  garage-meta:
  garage-data:

services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      LOG_SERVICE_URL: http://log-service:8002
      S3_ENDPOINT_URL: http://garage:3900
    networks:
      - catalog-net
    depends_on:
      - auth-service
      - log-service
      - garage

  migrate:
    build: .
    env_file:
      - .env
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    networks:
      - catalog-net
    profiles:
      - tools

  # Serviço de autenticação: login, cadastro, papéis (role) e (a partir da
  # fase 3) esqueci-minha-senha. De propósito SEM `ports:` — não é
  # alcançável do host, só de dentro da rede `catalog-net`, pelo nome do
  # serviço (http://auth-service:8001). O catálogo (`api`) é o único
  # container com porta publicada pro host.
  auth-service:
    build: ./auth-service
    env_file:
      - .env
    environment:
      LOG_SERVICE_URL: http://log-service:8002
    expose:
      - "8001"
    networks:
      - catalog-net
    depends_on:
      - log-service

  migrate-auth:
    build: ./auth-service
    env_file:
      - .env
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    networks:
      - catalog-net
    profiles:
      - tools

  # Serviço de auditoria (atividade 5): recebe evento de log de todo mundo
  # (catálogo, auth-service) e grava num Redis Stream. Mesmo princípio do
  # auth-service: sem `ports:`, só alcançável de dentro da rede
  # `catalog-net`, pelo nome do serviço (http://log-service:8002).
  log-service:
    build: ./log-service
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8002"
    networks:
      - catalog-net
    depends_on:
      - redis

  # Guarda só os eventos de auditoria (Redis Stream) — não é o banco de
  # negócio (MySQL remoto, fora do compose), por isso um container à parte.
  # Sem `ports:`: só o log-service fala com ele, de dentro da rede.
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - catalog-net
    volumes:
      - redis-data:/data

  # Object storage (atividade 6): guarda o arquivo da foto de perfil — o
  # MySQL guarda só a chave do objeto. Garage no lugar do MinIO.
  # Mesmo princípio dos outros serviços internos: sem `ports:`. O navegador
  # abre a foto por URL pré-assinada no domínio do catálogo, que repassa pro
  # Garage pela rede interna (app/routers/storage_proxy.py).
  garage:
    build: ./garage
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-api-filmes-perfis}
    expose:
      - "3900"
    networks:
      - catalog-net
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

networks:
  catalog-net:
    driver: bridge

services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
    networks:
      - catalog-net
    depends_on:
      - auth-service

  migrate:
    build: .
    env_file:
      - .env
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    networks:
      - catalog-net
    profiles:
      - tools

  # Serviço de autenticação: login, cadastro, papéis (role) e (a partir da
  # fase 3) esqueci-minha-senha. De propósito SEM `ports:` — não é
  # alcançável do host, só de dentro da rede `catalog-net`, pelo nome do
  # serviço (http://auth-service:8001). O catálogo (`api`) é o único
  # container com porta publicada pro host.
  auth-service:
    build: ./auth-service
    env_file:
      - .env
    expose:
      - "8001"
    networks:
      - catalog-net

  migrate-auth:
    build: ./auth-service
    env_file:
      - .env
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    networks:
      - catalog-net
    profiles:
      - tools

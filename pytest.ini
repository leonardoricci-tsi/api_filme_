[pytest]
pythonpath = .
# Sem isso, rodar pytest da raiz também descobre log-service/tests/ (seu
# próprio pacote `tests`, com conftest.py próprio) e colide na hora de
# importar — os dois se chamam "tests". Cada serviço roda sua suíte a
# partir da própria pasta (log-service tem o próprio pytest.ini).
testpaths = tests

# CI/CD (atividade extra): a cada push ou pull request, confere se o código
# ainda funciona — os testes passam, as 4 imagens Docker buildam e a stack
# inteira sobe e responde (smoke test). Qualquer falha deixa o commit
# marcado como quebrado (vermelho) no GitHub. Se tudo passou e é um push na
# main, publica as imagens no GHCR com tag ligada ao commit (sha-xxxxxxx) e
# faz o deploy: aponta o docker-compose.portainer.yml pra essa tag, e o
# Portainer (stack via Git) sobe a versão nova sozinho.
#
# Nenhum segredo aqui: os testes rodam com SQLite em memória e mocks, e o
# ambiente deles (segredos fictícios, serviços apontando pra porta fechada)
# é definido no próprio tests/conftest.py — não existe .env no runner.
name: CI

on:
  push:
  pull_request:

# Dois pushes seguidos na mesma branch: o run antigo é cancelado, só o do
# commit mais novo importa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes-catalogo:
    name: Testes — catálogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -v

  testes-log-service:
    name: Testes — log-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: log-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  build-imagens:
    name: Build — ${{ matrix.servico }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # A imagem do catálogo também compila o Angular (stage 1 do
          # Dockerfile) — build do front quebrado quebra aqui.
          - servico: api
            contexto: .
          - servico: auth-service
            contexto: ./auth-service
          - servico: log-service
            contexto: ./log-service
          - servico: garage
            contexto: ./garage
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          platforms: linux/amd64
          push: false
          # Cache das camadas entre runs (por serviço) — o npm ci / pip
          # install só roda de novo quando o arquivo de dependências muda.
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}

  # Sobe a stack INTEIRA de verdade (catálogo, auth-service, log-service,
  # Redis, Garage + um MySQL descartável) e exercita o caminho real: login,
  # upload de foto pro Garage, URL pré-assinada, 403 no perfil alheio,
  # evento no log de auditoria. Os testes acima usam mock; este não.
  smoke-test:
    name: Smoke test — stack de pé
    needs: [testes-catalogo, testes-log-service]
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: smoke
    steps:
      - uses: actions/checkout@v4

      # O docker-compose.yml lê o .env — no runner ele não existe, então é
      # gerado aqui com valores DESCARTÁVEIS, aleatórios a cada run: senha
      # do MySQL temporário, JWT_SECRET, chaves do Garage. Nenhum é segredo
      # de verdade (nada disso existe fora deste run) e nenhum fica no repo.
      # TMDB/SMTP recebem valor fictício: o smoke test não passa por eles.
      - name: Gerar .env descartável
        run: |
          DB_PASSWORD="$(openssl rand -hex 16)"
          {
            echo "CI_DB_USER=ci"
            echo "CI_DB_PASSWORD=$DB_PASSWORD"
            echo "DATABASE_URL=mysql+pymysql://ci:$DB_PASSWORD@mysql:3306/api_filmes"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "TMDB_API_KEY=ci-fake"
            echo "SMTP_USER=ci-fake"
            echo "SMTP_PASSWORD=ci-fake"
            echo "GARAGE_RPC_SECRET=$(openssl rand -hex 32)"
            echo "S3_ACCESS_KEY=GK$(openssl rand -hex 16)"
            echo "S3_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env

      - name: Build das imagens
        run: docker compose build

      # Ordem importa: a migration inicial do catálogo cria `usuarios`, e a
      # do auth-service só acrescenta colunas nela. De quebra, prova que o
      # banco inteiro sai do zero só com as migrations.
      - name: MySQL + migrations
        run: |
          docker compose up -d --wait mysql
          docker compose run --rm migrate
          docker compose run --rm migrate-auth

      - name: Subir a stack
        run: docker compose up -d --wait

      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost:8000

      - name: Logs dos containers (só se falhou)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v

  # CD: só chega aqui se TUDO acima passou, e só em push na main (pull
  # request e outras branches só testam). Publica as 4 imagens no GHCR com
  # duas tags: sha-<7 primeiros caracteres do commit> — rastreável, é essa
  # que roda em produção — e latest.
  #
  # Autentica com o GITHUB_TOKEN que o próprio Actions cria pra cada run
  # (vale só durante o run, escopo deste repositório) — não existe senha
  # de registry guardada em lugar nenhum.
  publicar:
    name: Publicar — ${{ matrix.servico }}
    needs: [testes-catalogo, testes-log-service, build-imagens, smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - servico: api
            contexto: .
            imagem: api-filmes
          - servico: auth-service
            contexto: ./auth-service
            imagem: api-filmes-auth
          - servico: log-service
            contexto: ./log-service
            imagem: api-filmes-log
          - servico: garage
            contexto: ./garage
            imagem: api-filmes-garage
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Gera as tags (sha-abc1234 + latest) e os labels OCI — o label
      # org.opencontainers.image.source liga o pacote a este repositório.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.imagem }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Mesmo cache do job de build acima: a imagem já foi buildada
          # neste run, aqui é praticamente só empacotar e subir.
          cache-from: type=gha,scope=${{ matrix.servico }}

  # Deploy (GitOps): não acessa o servidor — só escreve no repositório QUAL
  # versão deve estar no ar. Reescreve as tags do docker-compose.portainer.yml
  # pra sha-<commit> e faz um commit automático. A stack do Portainer é
  # criada a partir deste repositório com atualização automática: ela
  # percebe a mudança e sobe exatamente essas imagens.
  #
  # O commit do robô não dispara outro CI: push feito com o GITHUB_TOKEN não
  # gera novo run (regra do próprio Actions), e o [skip ci] reforça.
  deploy:
    name: Deploy — aponta produção pro commit
    needs: publicar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Opcional. Se o secret existir, avisa o Portainer na hora (webhook da
      # stack) em vez de esperar o próximo polling. A URL do webhook é
      # credencial — quem tem ela pode forçar redeploy — por isso é Secret.
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Apontar o compose de produção pra tag deste commit
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -E -i "s#(image: ghcr\.io/${GITHUB_REPOSITORY_OWNER}/api-filmes[a-z-]*):.*#\1:${TAG}#" docker-compose.portainer.yml
          grep -n "image: ghcr.io" docker-compose.portainer.yml
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Commit automático
        run: |
          if git diff --quiet docker-compose.portainer.yml; then
            echo "Compose já aponta pra $TAG (re-run do mesmo commit) — nada a commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: $TAG [skip ci]"
          # Se alguém deu push no meio do caminho, rebase em cima da main
          # nova. (O run desse push novo também vai fazer o próprio deploy.)
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Avisar o Portainer (webhook, se configurado)
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK_URL"

<h1>Meus favoritos</h1>

@if (carregando()) {
  <p>Carregando...</p>
} @else if (favoritos().length === 0) {
  <p class="vazio">Você ainda não favoritou nenhum filme.</p>
} @else {
  <div class="grid">
    @for (favorito of favoritos(); track favorito.id) {
      <app-movie-card
        [tmdbMovieId]="favorito.tmdb_movie_id"
        [titulo]="favorito.titulo"
        [posterUrl]="posterUrl(favorito.poster_path)"
        [posterPath]="favorito.poster_path"
        [isFavorito]="true"
        (toggleFavorito)="remover(favorito)"
      ></app-movie-card>
    }
  </div>
}

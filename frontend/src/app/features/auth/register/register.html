<div class="auth-page">
  <div class="auth-card">
    <div class="auth-cena">
      <img src="/fundo-login.svg" alt="" class="auth-cena-fundo" />
      <img src="/logo.svg" alt="Tom Hanks — catálogo de filmes" class="auth-cena-logo" />
    </div>

    <form class="auth-form" (ngSubmit)="cadastrar()">
      <h2>Cadastrar</h2>

      <label class="campo">
        <span class="campo-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
          </svg>
        </span>
        <input type="text" name="nome" [(ngModel)]="nome" placeholder="Nome" required />
      </label>

      <label class="campo">
        <span class="campo-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M3 7l9 6 9-6" />
          </svg>
        </span>
        <input type="email" name="email" [(ngModel)]="email" placeholder="Email" required />
      </label>

      <label class="campo">
        <span class="campo-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="9" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
        </span>
        <input
          type="password"
          name="senha"
          [(ngModel)]="senha"
          placeholder="Senha (mín. 8 caracteres)"
          minlength="8"
          required
        />
      </label>

      @if (erro()) {
        <p class="erro">{{ erro() }}</p>
      }

      <button type="submit" [disabled]="carregando()">
        {{ carregando() ? 'Cadastrando...' : 'Cadastrar' }}
      </button>

      <p class="link-secundario">Já tem conta? <a routerLink="/login">Entrar</a></p>
    </form>
  </div>
</div>

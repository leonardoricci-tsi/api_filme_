<div class="auth-page">
  <form class="auth-form" (ngSubmit)="redefinir()">
    <h1>🎬 Catálogo de Filmes</h1>
    <h2>Redefinir senha</h2>

    @if (sucesso()) {
      <p class="mensagem-sucesso">Senha redefinida com sucesso.</p>
      <p class="link-secundario"><a routerLink="/login">Ir para o login</a></p>
    } @else if (!token) {
      <p class="erro">Link inválido: token não encontrado na URL.</p>
      <p class="link-secundario"><a routerLink="/esqueci-senha">Pedir um novo link</a></p>
    } @else {
      <input
        type="password"
        name="novaSenha"
        [(ngModel)]="novaSenha"
        placeholder="Nova senha (mín. 8 caracteres)"
        minlength="8"
        required
      />

      @if (erro()) {
        <p class="erro">{{ erro() }}</p>
        <p class="link-secundario"><a routerLink="/esqueci-senha">Pedir um novo link</a></p>
      }

      <button type="submit" [disabled]="carregando()">
        {{ carregando() ? 'Redefinindo...' : 'Redefinir senha' }}
      </button>
    }
  </form>
</div>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-cena">
      <img src="/fundo-login.svg" alt="" class="auth-cena-fundo" />
      <img src="/logo.svg" alt="Tom Hanks — catálogo de filmes" class="auth-cena-logo" />
    </div>

    <form class="auth-form" (ngSubmit)="redefinir()">
      <h2>Redefinir senha</h2>

      @if (sucesso()) {
        <p class="mensagem-sucesso">Senha redefinida com sucesso.</p>
        <p class="link-secundario"><a routerLink="/login">Ir para o login</a></p>
      } @else if (!token) {
        <p class="erro">Link inválido: token não encontrado na URL.</p>
        <p class="link-secundario"><a routerLink="/esqueci-senha">Pedir um novo link</a></p>
      } @else {
        <label class="campo">
          <span class="campo-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="9" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
          </span>
          <input
            type="password"
            name="novaSenha"
            [(ngModel)]="novaSenha"
            placeholder="Nova senha (mín. 8 caracteres)"
            minlength="8"
            required
          />
        </label>

        @if (erro()) {
          <p class="erro">{{ erro() }}</p>
          <p class="link-secundario"><a routerLink="/esqueci-senha">Pedir um novo link</a></p>
        }

        <button type="submit" [disabled]="carregando()">
          {{ carregando() ? 'Redefinindo...' : 'Redefinir senha' }}
        </button>
      }
    </form>
  </div>
</div>

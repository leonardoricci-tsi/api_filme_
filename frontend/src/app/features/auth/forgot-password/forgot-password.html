<div class="auth-page">
  <form class="auth-form" (ngSubmit)="enviar()">
    <h1>🎬 Catálogo de Filmes</h1>
    <h2>Esqueci minha senha</h2>

    @if (mensagem()) {
      <p class="mensagem-sucesso">{{ mensagem() }}</p>
    } @else {
      <input type="email" name="email" [(ngModel)]="email" placeholder="Email" required />

      @if (erro()) {
        <p class="erro">{{ erro() }}</p>
      }

      <button type="submit" [disabled]="carregando()">
        {{ carregando() ? 'Enviando...' : 'Enviar link de redefinição' }}
      </button>
    }

    <p class="link-secundario">
      Lembrou a senha? <a routerLink="/login">Entrar</a>
    </p>
  </form>
</div>

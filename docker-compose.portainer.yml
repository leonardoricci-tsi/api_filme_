# Stack de produção (Portainer), criada A PARTIR DESTE REPOSITÓRIO (stack
# via Git, com atualização automática). As tags sha-xxxxxxx abaixo NÃO são
# editadas à mão: a cada push na main que passa no CI, o job "Deploy" do
# .github/workflows/ci.yml publica as imagens no GHCR e reescreve essas
# tags pro commit novo (commit automático "deploy: sha-..."). O Portainer
# percebe a mudança no repositório e sobe exatamente essa versão.
#
# Segredos (DATABASE_URL, JWT_SECRET, TMDB_API_KEY, SMTP_*, GARAGE_*, S3_*)
# ficam nas variáveis de ambiente da stack no Portainer — nunca aqui.
networks:
  catalog-net:
    driver: bridge

volumes:
  redis-data:
  garage-meta:
  garage-data:

services:
  api:
    image: ghcr.io/leonardoricci-tsi/api-filmes:sha-e424517
    ports:
      - "8215:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TMDB_API_KEY: ${TMDB_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      AUTH_SERVICE_URL: http://auth-service:8001
      LOG_SERVICE_URL: http://log-service:8002
      S3_ENDPOINT_URL: http://garage:3900
      # Domínio público do catálogo: a URL pré-assinada da foto é assinada
      # com esse host e servida por ele (repasse pro Garage, que não tem porta).
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-api-filmes-perfis}
    networks:
      - catalog-net
    depends_on:
      - auth-service
      - log-service
      - garage
    restart: unless-stopped

  auth-service:
    image: ghcr.io/leonardoricci-tsi/api-filmes-auth:sha-e424517
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      CATALOG_PUBLIC_URL: ${CATALOG_PUBLIC_URL}
      LOG_SERVICE_URL: http://log-service:8002
    expose:
      - "8001"
    networks:
      - catalog-net
    depends_on:
      - log-service
    restart: unless-stopped

  # Serviço de auditoria (atividade 5): recebe evento de log de todo mundo
  # (catálogo, auth-service) e grava num Redis Stream. Mesmo princípio dos
  # outros dois: sem `ports:`, só alcançável de dentro da `catalog-net`.
  log-service:
    image: ghcr.io/leonardoricci-tsi/api-filmes-log:sha-e424517
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8002"
    networks:
      - catalog-net
    depends_on:
      - redis
    restart: unless-stopped

  # Guarda só os eventos de auditoria (Redis Stream) — não é o banco de
  # negócio (MySQL remoto, fora do compose). Sem `ports:`: só o
  # log-service fala com ele, de dentro da rede.
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - catalog-net
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Object storage (atividade 6): fotos de perfil. Imagem própria com o
  # garage.toml dentro (garage/Dockerfile) — aqui não existe o repositório
  # pra montar o arquivo. Sem `ports:`: o navegador pega a foto pelo
  # domínio do catálogo, que repassa pra cá pela rede interna.
  garage:
    image: ghcr.io/leonardoricci-tsi/api-filmes-garage:sha-e424517
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-api-filmes-perfis}
    expose:
      - "3900"
    networks:
      - catalog-net
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    restart: unless-stopped
